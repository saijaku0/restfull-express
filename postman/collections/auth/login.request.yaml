scripts:
  - type: afterResponse
    code: "if (pm.response.code === 200 || pm.response.code === 201) {\r

      \  const body = pm.response.json();\r

      \  if (body.accessToken) {\r

      \    pm.environment.set('accessToken', body.accessToken);\r

      \    console.log('accessToken saved to environment');\r

      \  }\r

      }"
